<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#244b37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="description" content="Explore, pule e plane com Tico. Uma aventura sobre amizade na floresta.">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#c4e0d9; color:#244b37; font-family:system-ui,sans-serif; }
    canvas { display:block; outline:none; touch-action:none; }
    button { font:inherit; font-weight:650; min-height:48px; padding:10px 20px; border:0; border-radius:14px; background:#244b37; color:#fff3d9; cursor:pointer; }
    button:focus-visible { outline:3px solid #b66b2c; outline-offset:4px; }
    button:disabled { opacity:.65; cursor:wait; }
    [hidden] { display:none !important; }
    .overlay { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); background:linear-gradient(#31543e33,#31543e55),url('forest-cover.png') center/cover,#c4e0d9; text-align:center; }
    .card { max-width:560px; padding:24px 30px; border:2px solid #afbd86; border-radius:28px; background:#fff2d9f2; box-shadow:0 12px 50px #18332355; }
    .card img { width:112px; height:112px; border-radius:28px; }
    h1 { font-size:clamp(25px,5vw,38px); line-height:1.1; margin:15px 0; }
    p { line-height:1.5; }
    progress { width:100%; height:18px; accent-color:#244b37; }
    #notice { min-height:24px; }
    #tools { position:fixed; z-index:3; bottom:max(8px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:8px; }
    #tools button { min-height:44px; padding:8px 14px; font-size:14px; background:#244b37dd; }
    #update-state { position:fixed; z-index:4; right:max(12px,env(safe-area-inset-right)); bottom:max(66px,calc(env(safe-area-inset-bottom) + 58px)); width:min(360px,calc(100vw - 24px)); padding:12px 15px; border:2px solid #afbd86; border-radius:16px; background:#fff2d9f2; box-shadow:0 7px 25px #18332344; text-align:left; }
    #update-state p { margin:0 0 7px; font-size:14px; font-weight:650; }
    #update-progress { height:12px; }
    #rotate { z-index:20; display:none; }
    #safe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    @media (pointer:coarse) and (orientation:portrait) { #rotate { display:grid; } }
    @media (max-height:450px) { .card img { width:64px; height:64px; } h1 { margin:8px 0; } .card p { margin:8px 0; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Tico e Pipo — Bosque, Rio, Montanha e Vila">Seu navegador precisa oferecer suporte a canvas.</canvas>
  <div id="safe"></div>
  <section id="boot" class="overlay">
    <div class="card">
      <img src="icon-192.png" alt="Tico, o esquilo">
      <h1>Tico e a Floresta das Nozes</h1>
      <p>Quatro mundos para explorar<br>Uma aventura entre amigos.</p>
      <button id="play" type="button">Jogar</button>
      <progress id="progress" hidden aria-label="Carregando o jogo"></progress>
      <p id="notice" role="status" aria-live="polite"></p>
      <small id="offline-status">Preparando o jogo para funcionar offline…</small>
    </div>
  </section>
  <section id="rotate" class="overlay"><div class="card"><h1>Vire o celular</h1><p>Jogue com a tela deitada para enxergar o caminho.</p></div></section>
  <nav id="tools" aria-label="Opções do aplicativo">
    <button id="install" type="button" hidden>Instalar</button>
    <button id="update" type="button" hidden>Atualizar</button>
  </nav>
  <aside id="update-state" hidden aria-live="polite">
    <p id="update-message">Preparando atualização…</p>
    <progress id="update-progress" max="100" value="0" aria-label="Progresso da atualização"></progress>
  </aside>
  <noscript><section class="overlay">Ative o JavaScript para jogar com Tico.</section></noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const canvas = document.getElementById('canvas');
    const play = document.getElementById('play');
    const notice = document.getElementById('notice');
    const progress = document.getElementById('progress');
    const install = document.getElementById('install');
    const update = document.getElementById('update');
    const updateState = document.getElementById('update-state');
    const updateMessage = document.getElementById('update-message');
    const updateProgress = document.getElementById('update-progress');
    let installPrompt;
    let registration;
    let started = false;
    const hadServiceWorkerAtOpen = Boolean(navigator.serviceWorker?.controller);
    window.ticoSafeInsets = () => {
      const s = getComputedStyle(document.getElementById('safe'));
      return [s.paddingLeft,s.paddingTop,s.paddingRight,s.paddingBottom].map(v => parseFloat(v) || 0);
    };
    addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event; install.hidden = false;
    });
    addEventListener('appinstalled', () => { install.hidden = true; installPrompt = null; });
    install.addEventListener('click', async () => {
      if (!installPrompt) return;
      await installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null; install.hidden = true;
      if (started) canvas.focus();
    });
    async function enterGameFullscreen() {
      try {
        if (!document.fullscreenElement && document.fullscreenEnabled && document.documentElement.requestFullscreen)
          await document.documentElement.requestFullscreen({navigationUI:'hide'});
        await screen.orientation?.lock?.('landscape').catch(() => {});
      } catch { /* Alguns navegadores só oferecem tela cheia quando o jogo está instalado. */ }
    }
    update.addEventListener('click', () => {
      update.disabled = true;
      update.textContent = 'Atualizando…';
      registration?.waiting?.postMessage({type:'ACTIVATE_UPDATE'});
    });
    if ('serviceWorker' in navigator && isSecureContext) {
      navigator.serviceWorker.addEventListener('message', event => {
        const data = event.data;
        if (data?.type !== 'UPDATE_PROGRESS') return;
        updateState.hidden = false;
        const total = Number(data.totalBytes) || Number(data.total) || 1;
        const done = Math.min(total,Number(data.doneBytes) || Number(data.done) || 0);
        updateProgress.max = total;
        updateProgress.value = done;
        const percent = Math.round(done/total*100);
        if (data.phase === 'ready') {
          if (hadServiceWorkerAtOpen) {
            updateMessage.textContent = 'Atualização pronta para instalar.';
          } else {
            updateMessage.textContent = 'Jogo preparado para funcionar offline.';
            setTimeout(() => { if (update.hidden) updateState.hidden = true; },1800);
          }
        } else if (data.reused > 0) {
          updateMessage.textContent = `Preparando atualização: ${percent}% • ${data.reused} arquivos reaproveitados`;
        } else {
          updateMessage.textContent = `Baixando atualização: ${percent}%`;
        }
      });
      navigator.serviceWorker.register(config.serviceWorker, {scope:'./', updateViaCache:'none'}).then(async reg => {
        registration = reg;
        const showUpdate = () => {
          update.hidden = !(reg.waiting && reg.active);
          if (!update.hidden) {
            updateState.hidden = false;
            updateProgress.max = 100;
            updateProgress.value = 100;
            updateMessage.textContent = 'Atualização pronta para instalar.';
          }
        };
        showUpdate();
        reg.addEventListener('updatefound', () => reg.installing?.addEventListener('statechange', showUpdate));
        await reg.update();
        await navigator.serviceWorker.ready;
        document.getElementById('offline-status').textContent = 'Pronto para jogar offline neste dispositivo.';
      }).catch(() => { document.getElementById('offline-status').textContent = 'Jogue online. O modo offline ainda não está disponível.'; });
      let hadController = hadServiceWorkerAtOpen;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) location.reload();
        hadController = true;
      });
    } else {
      document.getElementById('offline-status').textContent = 'Instalação e modo offline ficam disponíveis pelo endereço HTTPS.';
    }
    play.addEventListener('click', async () => {
      if (started) return;
      play.disabled = true; progress.hidden = false; notice.textContent = 'Carregando a floresta…';
      try {
        await enterGameFullscreen();
        const missing = Engine.getMissingFeatures({threads:false});
        if (missing.length) throw new Error('Este navegador não oferece os recursos gráficos necessários. Tente um navegador atualizado.');
        await engine.startGame({onProgress:(current,total) => {
          if (total > 0) { progress.max = total; progress.value = current; }
          else progress.removeAttribute('value');
        }});
        started = true;
        document.getElementById('boot').hidden = true;
        canvas.focus();
      } catch (error) {
        console.error(error);
        notice.textContent = 'Não foi possível abrir o jogo. Verifique a conexão e tente novamente.';
        progress.hidden = true; play.disabled = false; play.textContent = 'Tentar novamente';
      }
    });
  </script>
</body>
</html>
